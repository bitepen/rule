name: ci

on:
  workflow_dispatch:
  # 每天北京时间 6:00 触发一次
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add token
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set variables
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "REPODIR=$PWD" >> $GITHUB_ENV

      - name: Sync with upstream
        run: |
          git checkout master
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --depth=1 upstream
          mkdir -p ./backup/
          cp -f .gitignore README.md .github/workflows/ci.yaml script/convert.sh ./backup/
          git merge upstream/master --strategy-option theirs --allow-unrelated-histories --no-edit
          cp -f ./backup/.gitignore .gitignore
          cp -f ./backup/README.md README.md
          cp -f ./backup/ci.yaml .github/workflows/ci.yaml
          cp -f ./backup/convert.sh script/convert.sh

      # 1. 自动剔除黑名单规则
      - name: Remove Excluded Rules
        run: |
          if [ -d "./remove_rules" ]; then
            echo "正在剔除黑名单规则..."
            find ./remove_rules -type f -name "*.list" | while IFS= read -r exclude_file; do
              target_name=$(basename "$exclude_file")
              # 在 rule 目录下寻找对应的所有同名文件
              find ./rule -type f -name "$target_name" | while IFS= read -r target_file; do
                while IFS= read -r del_pattern || [ -n "$del_pattern" ]; do
                  # 跳过空行和纯注释
                  [[ -z "$del_pattern" || "$del_pattern" =~ ^[[:space:]]*# ]] && continue
                  # 利用 sed 匹配包含该域名的整行并直接删除
                  sed -i "/$del_pattern/d" "$target_file"
                  echo "已从 $target_file 剔除: $del_pattern"
                done < "$exclude_file"
              done
            done
          fi

      # 2. 自动追加自定义规则
      - name: Append Custom Rules
        run: |
          if [ -d "./custom_rules" ]; then
            echo "正在应用自定义规则补丁..."
            find ./custom_rules -type f -name "*.list" | while IFS= read -r patch_file; do
              target_name=$(basename "$patch_file")
              find ./rule -type f -name "$target_name" | while IFS= read -r target_file; do
                while IFS= read -r rule_line || [ -n "$rule_line" ]; do
                  [[ -z "$rule_line" || "$rule_line" =~ ^[[:space:]]*# ]] && continue
                  if ! grep -qxF "$rule_line" "$target_file"; then
                    echo "$rule_line" >> "$target_file"
                    echo "已向 $target_file 追加: $rule_line"
                  fi
                done < "$patch_file"
              done
            done
          fi

      - name: Background run subconverter
        run: |
          curl -s https://api.github.com/repos/tindy2013/subconverter/releases \
            | grep "browser_download_url.*subconverter_linux64.tar.gz" \
            | head -n 1 \
            | cut -d '"' -f 4 \
            | xargs wget -q
          tar -xf subconverter_linux64.tar.gz
          ./subconverter/subconverter &
          python3 -m http.server 8080 --bind 127.0.0.1 --directory './rule/' &

      - name: Background run mihomo
        run: |
          curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases \
            | grep "browser_download_url.*mihomo-linux-amd64-alpha.*.deb" \
            | head -n 1 \
            | cut -d '"' -f 4 \
            | xargs wget -q -O mihomo-linux-amd64-alpha.deb
          sudo apt install --fix-missing ./mihomo-linux-amd64-alpha.deb
          /usr/bin/mihomo &

      - name: start convert
        run: |
          chmod +x ./script/convert.sh
          ./script/convert.sh

      - name: Commit and Push Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add --all
            git commit -m "${{ env.BUILDTIME }} for OCD"
            git push origin master
          else
            echo "No changes to commit"
          fi
